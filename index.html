<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Age Check</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --error-red: #ef4444;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .card {
            background: var(--glass-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            /* Ensures everything inside is centered */
            display: flex;
            flex-direction: column;
            align-items: stretch; 
        }

        h4 {
            text-align: center;
            margin-bottom: 2rem; /* Replaces the <br> for better alignment */
            font-size: 1.25rem;
            color: #111827;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #374151;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error-banner {
            display: none;
            background-color: var(--error-red);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center; /* Aligns the error text */
            text-transform: uppercase;
        }

        /* Remove arrow keys */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h4>Please enter your age to continue</h4>
        
        <form id="ageForm">
            <div class="form-group">
                <label for="ageInput">Your Age</label>
                <input type="number" id="ageInput" placeholder="e.g. 25" required min="1" max="120">
            </div>
            <button type="submit">Submit</button>
        </form>

        <div id="error-banner">
            ⚠️ User with this age already exists
        </div>
    </div>

    <script>
        // age prank site
        const form = document.getElementById('ageForm');
        const errorBanner = document.getElementById('error-banner');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorBanner.style.display = 'block';
        });
    </script>

</body>
</html>
